name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Lint warnings do not fail the build: the runner's swift-format can be older than the one the
      # tree was formatted with, and that difference is not a reason for a red build.
      - run: xcrun swift-format lint --recursive Intonate IntonateTests IntonateUITests Packages
      - run: swift test --package-path Packages/IntonateCore
      - run: scripts/ci-ios.sh
